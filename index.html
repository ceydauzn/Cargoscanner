<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaggageMatch | Senaryo 1 Testi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-blue-600 text-white text-center py-12 px-4 shadow-md">
        <h1 class="text-4xl font-bold mb-2">BaggageMatch ✈️</h1>
        <p class="text-lg">Kargonuzu veya fazla bagajınızı anında fiyatlandırın.</p>
    </header>

    <section class="max-w-xl mx-auto mt-10 mb-20 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Gönderi Fiyatı Hesapla</h2>
        
        <form action="/submit" method="POST" class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nereden?</label>
                    <select name="from_city" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="IST">İstanbul (IST)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nereye?</label>
                    <select name="to_city" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="BER">Berlin (BER)</option>
                        <option value="MUC">Münih (MUC)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kargo Ağırlığı (KG)</label>
                <input type="number" id="kg_input" name="kg" value="20" min="1" max="50" oninput="calculatePrice()" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-blue-500 focus:border-blue-500" required>
                <p class="text-xs text-gray-500 mt-1">Sistem hesabı: KG x $1.75</p>
            </div>

            <div class="flex items-center mt-4">
                <input type="checkbox" id="urgent_check" name="urgent" onchange="calculatePrice()" class="h-5 w-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="urgent_check" class="ml-2 block text-sm text-gray-900">
                    Acil Kargo / Esnek Olmayan Zaman (+ $5.00)
                </label>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2 mt-4">Teslimat Seçeneği</label>
                <select id="delivery_type" name="delivery" onchange="calculatePrice()" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-blue-500 focus:border-blue-500">
                    <option value="0">Havalimanında Locker'a / Elden Teslim ($0.00)</option>
                    <option value="9">Kargo Şubesine Teslim (+ $9.00)</option>
                    <option value="18">Adrese Tam Teslim (+ $18.00)</option>
                </select>
            </div>

            <div class="mt-6 bg-blue-50 p-4 rounded-lg border border-blue-200 text-center">
                <span class="block text-sm text-gray-600 mb-1">Tahmini Ödeme (Provizyon Tutarı)</span>
                <span id="price_display" class="text-4xl font-extrabold text-blue-700">$35.00</span>
            </div>

            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-300 mt-4">
                Provizyonla ve İhaleyi Başlat
            </button>
        </form>
    </section>

    <script>
        function calculatePrice() {
            // Değerleri HTML'den çekiyoruz
            let kg = parseFloat(document.getElementById('kg_input').value) || 0;
            let isUrgent = document.getElementById('urgent_check').checked;
            let deliveryFee = parseFloat(document.getElementById('delivery_type').value);

            // Ana fiyatlandırma formülü
            let basePrice = kg * 1.75;
            let total = basePrice + deliveryFee;

            if (isUrgent) {
                total += 5.00;
            }

            // Fiyatı ekrana yazdır (Virgülden sonra 2 hane)
            document.getElementById('price_display').innerText = "$" + total.toFixed(2);
        }

        // Sayfa ilk yüklendiğinde hesaplamayı bir kere çalıştır
        window.onload = calculatePrice;
    </script>
</body>
</html>
