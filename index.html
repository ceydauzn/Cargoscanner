<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaggageMatch | Bagajını Kazanca Dönüştür</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-blue-600 text-white text-center py-20 px-4">
        <h1 class="text-5xl font-bold mb-4">BaggageMatch ✈️</h1>
        <p class="text-xl mb-8">İstanbul - Berlin arası bagajını paylaş, uçuşunu bedavaya getir veya kargonu yarı fiyatına gönder.</p>
        <div class="flex justify-center gap-4">
            <a href="#form-section" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-full shadow-lg transition duration-300">Hemen Test Et</a>
        </div>
    </header>

    {% if message %}
    <div class="max-w-2xl mx-auto mt-8 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative text-center">
        <span class="block sm:inline font-semibold">{{ message }}</span>
    </div>
    {% endif %}

    <section id="form-section" class="max-w-md mx-auto mt-12 mb-20 bg-white p-8 rounded-xl shadow-md border border-gray-100">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">İlk Eşleşmeni Yakala</h2>
        
        <form action="/submit" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kimsiniz?</label>
                <select name="user_type" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-blue-500 focus:border-blue-500">
                    <option value="Yolcu">Yolcuyum (Bagajımda yer var, para kazanmak istiyorum)</option>
                    <option value="Gönderici">Göndericiyim (Berlin'e uygun fiyata paket göndereceğim)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Adınız Soyadınız</label>
                <input type="text" name="name" required placeholder="Örn: Ayşe Yılmaz" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">İletişim (E-posta veya WhatsApp Numaranız)</label>
                <input type="text" name="contact" required placeholder="Sana ulaşabilmemiz için" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-300">
                Talebimi Gönder
            </button>
        </form>
    </section>

    <footer class="bg-gray-800 text-white text-center py-6 mt-12">
        <p>&copy; 2026 BaggageMatch. Tüm hakları saklıdır.</p>
        <p class="text-sm text-gray-400 mt-2">Güvenli P2P Lojistik Ağı</p>
    </footer>

</body>
</html>
