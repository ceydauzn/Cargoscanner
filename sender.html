<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargo Scanner | Kargo Gönder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .form-input {
            width: 100%; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem 1rem;
            transition: all 0.3s ease; outline: none; background-color: #fdfdfd;
        }
        .form-input:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); }
        .glass-card { background: white; border-radius: 1.5rem; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05); border: 1px solid #f1f5f9; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen py-10 px-4">

    <div class="w-full max-w-2xl flex justify-between items-center mb-8">
        <a href="/" class="flex items-center text-slate-500 hover:text-orange-500 transition font-medium">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Ana Sayfaya Dön
        </a>
        <div class="text-xl font-bold text-slate-800">Cargo<span class="text-orange-500">Scanner</span></div>
    </div>

    <section class="max-w-2xl w-full glass-card p-8 md:p-10 relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-amber-400 to-orange-500"></div>

        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-slate-900 mb-2">Gönderi Oluştur 📦</h2>
            <p class="text-slate-500">Kargo detaylarını girin, anında fiyat alın ve ihaleyi başlatın.</p>
        </div>
        
        <div id="notification" class="hidden mb-6 p-4 rounded-xl text-center font-semibold text-sm transition-all"></div>

        <form id="shipmentForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 bg-slate-50 p-5 rounded-2xl border border-slate-100">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Adınız Soyadınız</label>
                    <input type="text" id="sender_name" class="form-input" placeholder="Örn: Ceyda Uzun" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">İletişim (Tel/Mail)</label>
                    <input type="text" id="contact" class="form-input" placeholder="Mail veya Numara" required>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nereden?</label>
                    <select id="from_city" class="form-input text-slate-700 cursor-pointer">
                        <option value="IST">🇹🇷 İstanbul (IST)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nereye?</label>
                    <select id="to_city" class="form-input text-slate-700 cursor-pointer">
                        <option value="BER">🇩🇪 Berlin (BER)</option>
                        <option value="MUC">🇩🇪 Münih (MUC)</option>
                    </select>
                </div>
            </div>

            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100 space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5 flex items-center">
                        <svg class="w-4 h-4 mr-1.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>
                        Kargo Ağırlığı (KG)
                    </label>
                    <input type="number" id="kg_input" value="20" min="1" max="50" oninput="calculatePrice()" class="form-input font-bold text-lg text-slate-800" required>
                </div>

                <div class="flex items-center bg-white p-3 rounded-xl border border-slate-200">
                    <input type="checkbox" id="urgent_check" onchange="calculatePrice()" class="h-5 w-5 text-orange-500 rounded border-slate-300 focus:ring-orange-500 cursor-pointer">
                    <label for="urgent_check" class="ml-3 block text-sm font-medium text-slate-700 cursor-pointer">Acil Kargo İster Misiniz? <span class="text-orange-500 font-bold">(+ $5.00)</span></label>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Teslimat Seçeneği</label>
                    <select id="delivery_type" onchange="calculatePrice()" class="form-input text-slate-700 cursor-pointer">
                        <option value="0">📍 Havalimanında Locker'a Bırak ($0.00)</option>
                        <option value="9">🏢 Kargo Şubesine Teslim (+ $9.00)</option>
                        <option value="18">🏠 Adrese Tam Teslim (+ $18.00)</option>
                    </select>
                </div>
            </div>

            <div class="mt-8 bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-2xl text-center shadow-lg relative overflow-hidden">
                <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white opacity-5 rounded-full blur-xl"></div>
                <span class="block text-sm text-slate-300 mb-1 font-medium">Platform Provizyon Tutarı</span>
                <span id="price_display" class="text-5xl font-extrabold text-white tracking-tight">$35.00</span>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-4 px-4 rounded-xl shadow-lg shadow-orange-500/30 transition-all duration-300 transform hover:-translate-y-1 text-lg mt-6 flex justify-center items-center">
                <span>Öde ve İhaleyi Başlat</span>
                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </button>
        </form>
    </section>

    <script>
        let currentTotal = 35.00;
        function calculatePrice() {
            let kg = parseFloat(document.getElementById('kg_input').value) || 0;
            let isUrgent = document.getElementById('urgent_check').checked;
            let deliveryFee = parseFloat(document.getElementById('delivery_type').value);
            let basePrice = kg * 1.75;
            currentTotal = basePrice + deliveryFee;
            if (isUrgent) currentTotal += 5.00;
            document.getElementById('price_display').innerText = "$" + currentTotal.toFixed(2);
        }
        window.onload = calculatePrice;
        document.getElementById('shipmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="animate-pulse">İşleniyor...</span>';
            btn.disabled = true;
            const payload = {
                sender_name: document.getElementById('sender_name').value,
                contact: document.getElementById('contact').value,
                from_city: document.getElementById('from_city').value,
                to_city: document.getElementById('to_city').value,
                kg: parseFloat(document.getElementById('kg_input').value),
                calculated_price: currentTotal
            };
            try {
                const response = await fetch('/api/create_shipment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const notif = document.getElementById('notification');
                notif.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'border-red-200');
                
                if (result.status === 'success') {
                    notif.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
                    notif.innerHTML = `🎉 <b>Harika!</b> ${result.message}<br><span class="text-xs text-slate-500 mt-1 block">Takip Kodunuz: #${result.data.shipment_id}</span>`;
                    document.getElementById('shipmentForm').reset();
                    calculatePrice();
                }
            } catch (error) {
                console.error("API Hatası:", error);
            } finally {
                btn.innerHTML = '<span>Öde ve İhaleyi Başlat</span><svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
