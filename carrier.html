<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargo Scanner | Taşıyıcı Ekranı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .glass-card { background: white; border-radius: 1.5rem; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05); border: 1px solid #f1f5f9; transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .glass-card:hover { transform: translateY(-5px); box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.15); border-color: #e0e7ff; }
        .loader { border-top-color: #3b82f6; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen py-10 px-4">

    <div class="w-full max-w-4xl flex justify-between items-center mb-10">
        <a href="/" class="flex items-center text-slate-500 hover:text-blue-600 transition font-medium">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Ana Sayfaya Dön
        </a>
        <div class="text-xl font-bold text-slate-800">Cargo<span class="text-blue-600">Scanner</span></div>
    </div>

    <div class="w-full max-w-4xl text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <h1 class="text-4xl font-extrabold text-slate-900 mb-3 tracking-tight">Kargoları Tara</h1>
        <p class="text-slate-500 text-lg">Sistemdeki uygun kargoları bulun, teklif verin ve uçuşunuzu kazanca dönüştürün.</p>
    </div>

    <div class="w-full max-w-4xl relative">
        <div id="shipments-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-1 md:col-span-2 flex flex-col items-center justify-center py-20 text-slate-400">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4"></div>
                <p class="font-semibold animate-pulse">Sistem taranıyor...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadShipments() {
            try {
                const response = await fetch('/api/shipments');
                const result = await response.json();
                const container = document.getElementById('shipments-container');
                container.innerHTML = '';
                if (!result.data || result.data.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-1 md:col-span-2 bg-white rounded-3xl p-12 text-center border border-dashed border-slate-300">
                            <div class="text-6xl mb-4">📭</div>
                            <h3 class="text-xl font-bold text-slate-700 mb-2">Şu an uygun kargo yok</h3>
                            <p class="text-slate-500">Sistemde bekleyen bir ihalemiz bulunmuyor. Daha sonra tekrar tarayın!</p>
                        </div>
                    `;
                    return;
                }
                result.data.forEach(shipment => {
                    const card = document.createElement('div');
                    card.className = "glass-card p-6 flex flex-col justify-between relative overflow-hidden group";
                    card.innerHTML = `
                        <div class="absolute top-0 right-0 w-24 h-24 bg-blue-500 opacity-5 rounded-bl-full z-0 transition-transform group-hover:scale-110"></div>
                        
                        <div class="relative z-10 mb-6">
                            <div class="flex justify-between items-start mb-4">
                                <span class="bg-indigo-50 text-indigo-600 text-xs font-bold px-3 py-1 rounded-full border border-indigo-100">Bekliyor</span>
                                <span class="text-xs text-slate-400 font-medium">ID: #${shipment.shipment_id}</span>
                            </div>
                            
                            <h3 class="text-2xl font-extrabold text-slate-800 mb-1 tracking-tight">${shipment.route}</h3>
                            <p class="text-sm text-slate-500 font-medium mb-4 flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                Gönderici: ${shipment.sender_name}
                            </p>
                            
                            <div class="inline-flex items-center bg-slate-50 rounded-lg p-2 px-3 border border-slate-100">
                                <span class="text-slate-400 text-xs uppercase font-bold mr-2">Ağırlık</span>
                                <span class="text-slate-800 font-bold">${shipment.kg} KG</span>
                            </div>
                        </div>
                        <div class="relative z-10 border-t border-slate-100 pt-5 flex items-end justify-between">
                            <div>
                                <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Taşıma Bedeli</p>
                                <p class="text-4xl font-black text-emerald-500 tracking-tighter">$${shipment.current_bid}</p>
                            </div>
                            <button onclick="placeBid('${shipment.shipment_id}')" class="bg-slate-900 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-colors duration-300 flex items-center">
                                Taşırım
                                <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Yükleme hatası:", error);
            }
        }
        async function placeBid(shipmentId) {
            const name = prompt("Taşıyıcı Adınız nedir?");
            const contact = prompt("İletişim bilginiz (Tel/Mail)?");
            if (!name || !contact) return;
            const payload = {
                shipment_id: shipmentId,
                carrier_name: name,
                carrier_contact: contact
            };
            try {
                const response = await fetch('/api/place_bid', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert("🎉 Harika! " + result.message);
                    loadShipments(); 
                } else {
                    alert("Hata: " + result.message);
                }
            } catch (error) {
                alert("Bağlantı hatası oluştu.");
            }
        }
        window.onload = loadShipments;
    </script>
</body>
</html>
