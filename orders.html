<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Cargo Scanner | Kargo Takip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; } .glass-card { background: white; border-radius: 1.5rem; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05); border: 1px solid #f1f5f9; } </style>
</head>
<body class="flex flex-col items-center min-h-screen py-10 px-4">

    <div class="w-full max-w-4xl flex justify-between items-center mb-10">
        <a href="/" class="flex items-center text-slate-500 hover:text-blue-600 transition font-medium">← Ana Sayfaya Dön</a>
        <div class="text-xl font-bold text-slate-800">Cargo<span class="text-blue-600">Scanner</span></div>
    </div>

    <div class="w-full max-w-4xl mb-8">
        <h2 class="text-3xl font-extrabold text-slate-900">📍 Kargo Takip ve Siparişlerim</h2>
        <p class="text-slate-500 mt-2">Kargonuzun uçağa biniş, uçuş ve teslimat adımlarını canlı olarak takip edin.</p>
    </div>

    <div id="orders-container" class="w-full max-w-4xl space-y-6"></div>

    <script>
        const statusFlow = ['waiting_for_bids', 'carrier_received', 'boarded', 'in_flight', 'landed', 'delivered'];
        const statusLabels = ['İhalede', 'Taşıyıcıda', 'Uçağa Bindi', 'Uçuşta', 'İniş Yaptı', 'Teslim Edildi'];

        window.onload = async function() {
            const userStr = localStorage.getItem('cargo_user');
            if (!userStr) { window.location.href = '/auth'; return; }
            
            const user = JSON.parse(userStr);
            const response = await fetch('/api/my_shipments?email=' + encodeURIComponent(user.email));
            const result = await response.json();
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            result.data.forEach(ship => {
                const currentIndex = statusFlow.indexOf(ship.status);
                
                // Stepper (İlerleme Çubuğu) HTML'i Oluşturma
                let stepperHtml = '<div class="flex items-center justify-between mt-6 relative">';
                stepperHtml += '<div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-slate-200 z-0"></div>';
                
                statusLabels.forEach((label, idx) => {
                    let dotColor = idx <= currentIndex ? 'bg-blue-600 ring-4 ring-blue-100' : 'bg-slate-300';
                    let textColor = idx <= currentIndex ? 'text-blue-800 font-bold' : 'text-slate-400 font-medium';
                    stepperHtml += `
                        <div class="relative z-10 flex flex-col items-center">
                            <div class="w-6 h-6 rounded-full ${dotColor} transition-all duration-500"></div>
                            <span class="text-[10px] sm:text-xs mt-2 ${textColor} text-center w-16">${label}</span>
                        </div>
                    `;
                });
                stepperHtml += '</div>';

                container.innerHTML += `
                    <div class="glass-card p-6 md:p-8">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-black text-slate-800">${ship.route}</h3>
                                <p class="text-sm text-slate-500 font-medium">Takip No: #${ship.shipment_id} • Ağırlık: ${ship.kg} KG</p>
                            </div>
                            ${ship.status !== 'delivered' && currentIndex > 0 ? 
                                `<button onclick="confirmDelivery('${ship.shipment_id}')" class="bg-green-500 hover:bg-green-600 text-white text-sm font-bold py-2 px-4 rounded-xl shadow-lg transition-all">Teslim Aldım (Ödemeyi Aktar)</button>` 
                                : ''}
                        </div>
                        ${stepperHtml}
                    </div>
                `;
            });
        };

       async function confirmDelivery(shipmentId) {
            if(!confirm("Kargonun elinize ulaştığını onaylıyor musunuz?")) return;
            
            // GÜVENLİK YAMASI: İsteği atan kişinin e-postasını API'ye kanıt olarak sun
            const userStr = localStorage.getItem('cargo_user');
            const user = JSON.parse(userStr);

            try {
                const response = await fetch('/api/deliver', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        shipment_id: shipmentId, 
                        user_email: user.email // Kullanıcı e-postası eklendi!
                    })
                });
                const result = await response.json();
                
                if(result.status === 'success') {
                    alert("🎉 " + result.message);
                    window.location.reload();
                } else {
                    alert("Güvenlik Uyarısı: " + result.message);
                }
            } catch (error) {
                alert("Bağlantı hatası.");
            }
        }
    </script>
</body>
</html>
