<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargo Scanner | Siparişlerim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .glass-card { background: white; border-radius: 1.5rem; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.05); border: 1px solid #f1f5f9; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen py-10 px-4">

    <div class="w-full max-w-4xl flex justify-between items-center mb-10">
        <a href="/" class="flex items-center text-slate-500 hover:text-orange-500 transition font-medium">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Ana Sayfaya Dön
        </a>
        <div class="text-xl font-bold text-slate-800">Cargo<span class="text-orange-500">Scanner</span></div>
    </div>

    <div class="w-full max-w-4xl mb-8">
        <h2 class="text-3xl font-extrabold text-slate-900">📦 Kargolarım ve Siparişlerim</h2>
        <p class="text-slate-500 mt-2">Sistemdeki aktif ve teslim edilmiş kargolarınızı buradan yönetebilir, teslimat onayı vererek ödemeyi aktarabilirsiniz.</p>
    </div>

    <div id="orders-container" class="w-full max-w-4xl space-y-6">
        <p class="text-center text-slate-400 font-semibold mt-10 animate-pulse">Siparişleriniz yükleniyor...</p>
    </div>

    <script>
        window.onload = async function() {
            const userStr = localStorage.getItem('cargo_user');
            if (!userStr) {
                alert("Önce giriş yapmalısınız!");
                window.location.href = '/auth';
                return;
            }
            
            const user = JSON.parse(userStr);
            try {
                const response = await fetch('/api/my_shipments?email=' + encodeURIComponent(user.email));
                const result = await response.json();
                const container = document.getElementById('orders-container');
                container.innerHTML = '';

                if (result.data.length === 0) {
                    container.innerHTML = `<div class="glass-card p-10 text-center"><p class="text-xl font-bold text-slate-600">Henüz hiçbir gönderiniz yok.</p></div>`;
                    return;
                }

                result.data.forEach(ship => {
                    let isDelivered = ship.status === 'delivered';
                    let statusBadge = isDelivered 
                        ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold border border-green-200">✅ Teslim Edildi</span>`
                        : `<span class="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-xs font-bold border border-orange-200">⏳ İhalede / Bekliyor</span>`;
                        
                    let actionButton = isDelivered 
                        ? `<button disabled class="w-full sm:w-auto bg-slate-100 text-slate-400 font-bold py-3 px-6 rounded-xl cursor-not-allowed">İşlem Tamamlandı</button>`
                        : `<button onclick="confirmDelivery('${ship.shipment_id}')" class="w-full sm:w-auto bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-green-500/30 transition-all">Teslimatı Onayla & Ödemeyi Aktar</button>`;

                    container.innerHTML += `
                        <div class="glass-card p-6 flex flex-col sm:flex-row justify-between items-center gap-6">
                            <div>
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="text-sm font-bold text-slate-400">ID: #${ship.shipment_id}</span>
                                    ${statusBadge}
                                </div>
                                <h3 class="text-2xl font-black text-slate-800">${ship.route}</h3>
                                <p class="text-sm text-slate-500 font-medium mt-1">Ağırlık: ${ship.kg} KG • Provizyon: $${ship.provision_paid}</p>
                            </div>
                            <div class="w-full sm:w-auto text-right">
                                ${actionButton}
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error(error);
            }
        };

        async function confirmDelivery(shipmentId) {
            if(!confirm("Kargonun teslim edildiğini onaylıyor musunuz? Paranız taşıyıcıya aktarılacaktır.")) return;

            try {
                const response = await fetch('/api/deliver', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shipment_id: shipmentId })
                });
                const result = await response.json();
                if(result.status === 'success') {
                    alert("🎉 " + result.message);
                    window.location.reload(); // Sayfayı yenile ve yeşil tiki gör
                } else {
                    alert("Hata: " + result.message);
                }
            } catch (error) {
                alert("Bağlantı hatası.");
            }
        }
    </script>
</body>
</html>
